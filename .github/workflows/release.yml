# On a version tag (v0.1.0), build the addon zip and attach it to the GitHub release.
# The zip has a top-level SpellActivationsForever/ folder, which is what CurseForge requires.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the zip
        run: python tools/package.py "${GITHUB_REF_NAME}"
      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
